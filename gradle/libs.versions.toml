[libraries]
# Core pack: Contains the basic, most commonly used icons (like Favorite, Home, Settings)
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

# Extended pack: Contains thousands of additional icons (Massive library size)
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "androidxMedia3Transformer" }
androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3Effect" }
androidx-media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3Effect" }
androidx-media3-effect-v150 = { module = "androidx.media3:media3-effect", version.ref = "media3EffectVersion" }
androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3TransformerVersion" }
androidx-media3-transformer-v150 = { module = "androidx.media3:media3-transformer", version.ref = "androidxMedia3Transformer" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Effect" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }
ffmpeg-kit-full = { module = "com.extrovert.ffmpeg-kit:ffmpeg-kit-full", version.ref = "ffmpegKitFull" }
