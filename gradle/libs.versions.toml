coilCompose = "2.6.0"
coreKtx = "1.19.1"
devFfmpegKitFull = "6.0-4"
devFfmpegKitFullVersion = "8.1.7"
ffmpegKitFull = "6.0-2"
ffmpegKitFullVersion = "6.0.3"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
